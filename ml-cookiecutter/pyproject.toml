[project]
name = "ml-project"
version = "0.1.0"
description = "A modern, self-contained ML project template"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
keywords = ["machine-learning", "ml", "data-science"]

# Core dependencies - kept minimal and modern
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "polars>=1.0",           # Fast DataFrame library (optional alternative to pandas)
    "mlflow>=2.15",          # Experiment tracking & model registry
    "psycopg2-binary>=2.9",   # Postgres adapter for MLflow
    "pydantic>=2.0",         # Data validation and settings management
    "pydantic-settings>=2.0", # Environment configuration
    "loguru>=0.7",           # Simple, powerful logging
    "typer>=0.12",           # CLI framework
    "rich>=13.0",            # Beautiful terminal output
    "httpx>=0.27",           # Modern HTTP client
    "python-dotenv>=1.0",    # Environment variables
]

[project.optional-dependencies]
# Deep Learning (install with: uv pip install -e ".[deep-learning]")
deep-learning = [
    "torch>=2.3",
    "lightning>=2.3",
]

# Experiment tracking & Registry
tracking = [
    "mlflow>=2.15",
    "psycopg2-binary>=2.9",
]

# API serving
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

# Development tools
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",              # Fast linter and formatter
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipykernel>=6.29",        # Jupyter kernel
]

# All optional dependencies
all = [
    "ml-project[deep-learning,tracking,api,dev]",
]

[project.scripts]
# CLI entry points
ml-train = "ml_project.cli:train"
ml-predict = "ml_project.cli:predict"
ml-serve = "ml_project.cli:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_project"]

# =============================================================================
# Tool Configurations
# =============================================================================

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = ["E501"]  # line too long (handled by formatter)

[tool.ruff.lint.isort]
known-first-party = ["ml_project"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/ml_project"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
